name = "ctrl-y-v2"
main = "apps/api/src/worker.ts"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]
# Explicitly ensure the workers.dev URL is enabled on every deploy.
workers_dev = true

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Keep API navigation requests out of the SPA fallback.
run_worker_first = ["/api", "/api/*"]

# Keep caching disabled for read-after-write correctness.
[[hyperdrive]]
binding = "HYPERDRIVE"
# Requires your own Cloudflare/Supabase accounts:
# wrangler hyperdrive create <name> --connection-string=<supabase-connection-string> --caching-disabled
# Paste the resulting id below before deploying.
id = "585e296accb4488290bdc846ec1a08e9"

[triggers]
crons = ["*/5 * * * *"]
