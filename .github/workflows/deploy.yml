name: Firebase deploy
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" || -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT and FIREBASE_PROJECT_ID repository secrets before deploying."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14.17.0
      - name: Build and deploy Hosting and Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          credentials_file="$(mktemp "$RUNNER_TEMP/firebase-credentials.XXXXXX.json")"
          trap 'rm -f "$credentials_file"' EXIT
          chmod 600 "$credentials_file"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          unset FIREBASE_SERVICE_ACCOUNT
          # firebase.json predeploy builds @ctrl-y/web and @ctrl-y/api.
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,functions --non-interactive
