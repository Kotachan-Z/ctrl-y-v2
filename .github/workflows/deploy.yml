name: Cloudflare deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying."
            exit 1
          fi
          if [[ -z "$PRODUCTION_DATABASE_URL" ]]; then
            echo "::error::Configure PRODUCTION_DATABASE_URL repository secret before deploying."
            exit 1
          fi
          if [[ ! "$PRODUCTION_DATABASE_URL" =~ ^postgres(ql)?://[^/]*@[^/:@]+\.pooler\.supabase\.com:5432(/|\?|$) ]]; then
            echo "::error::PRODUCTION_DATABASE_URL must use the Session pooler connection string (port 5432) copied from the Supabase dashboard. The direct connection host is IPv6-only and unreachable from this IPv4 runner."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build web app
        run: bun run --filter @ctrl-y/web build
      # Deploy runs independently of CI success, so check generation here too.
      - name: Check for missing database migrations
        run: |
          if timeout --kill-after=5s 180s bun run --filter @ctrl-y/database generate < /dev/null; then
            :
          else
            status=$?
            if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
              echo "::error::drizzle-kit generate did not complete within the time limit (180s). Possible causes include runner slowness or an interactive prompt (e.g. for a possible column rename). Run bun run --filter @ctrl-y/database generate locally, investigate the cause, and commit any generated migrations."
            else
              echo "::error::drizzle-kit generate failed. Run bun run --filter @ctrl-y/database generate locally, fix the error, and commit the result."
            fi
            exit "$status"
          fi
          changes=$(git status --porcelain --untracked-files=all -- packages/database/migrations/)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            echo "::error::schema.ts was changed but the migration was not generated/committed. Run bun run --filter @ctrl-y/database generate locally and commit the result."
            exit 1
          fi
      - name: Preflight production database migrations
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: bun run --filter @ctrl-y/database preflight:production
      - name: Apply production database migrations
        # GitHub Actions hosted runners are IPv4-only; Supabase's direct host
        # db.PROJECT_REF.supabase.co is IPv6-only (AAAA record only), so it is unreachable.
        # Copy the Session pooler connection string (port 5432) from the Supabase dashboard.
        # The host prefix is generation-dependent (aws-0, aws-1, etc.).
        # Do not use the direct host or Transaction pooler (port 6543).
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: bun run --filter @ctrl-y/database migration:production
      - name: Verify production database migrations
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: bun run --filter @ctrl-y/database verify:production
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
